<script>    
/**
 * 1. 強化版データ解析ロジック（CSV/Numbers自動判別・省略なし）
 * カンマ区切り、またはNumbersのコピー（タブ区切り）を自動判別し、1列もズラさずに解析します。
 */
 function parseFlexibleData(text) {
    if (!text) return [];
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];

    // 1行目から区切り文字（タブかカンマか）を自動判定
    const headerLine = lines[0];
    const delimiter = headerLine.includes('\t') ? '\t' : ',';
    const headers = headerLine.split(delimiter).map(h => h.trim());

    return lines.slice(1).map(line => {
        let values = [];
        if (delimiter === '\t') {
            // タブ区切りの処理（Numbers/Excel等）
            values = line.split('\t');
        } else {
            // カンマ区切りの処理（ダブルクォーテーション対応）
            const result = [];
            let start = 0, inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                if (line[i] === '"') inQuotes = !inQuotes;
                else if (line[i] === ',' && !inQuotes) {
                    result.push(line.substring(start, i));
                    start = i + 1;
                }
            }
            result.push(line.substring(start));
            values = result;
        }

        const obj = {};
        headers.forEach((header, i) => {
            let val = values[i] ? values[i].trim() : "";
            // 前後の引用符を削除し、内部のダブルクォーテーションを戻す
            if (val.startsWith('"') && val.endsWith('"')) {
                val = val.substring(1, val.length - 1);
            }
            obj[header] = val.replace(/""/g, '"');
        });
        return obj;
    });
}

/**
 * 2. 各種スイッチの状態取得
 */
function getSwitches() {
    return {
        mainSwitch: document.getElementById('cfg-main-sw').value,
        searchBoxSwitch: document.getElementById('cfg-search-sw').value,
        searchBoxThreshold: parseInt(document.getElementById('cfg-search-thr').value) || 0,
        brandBoxSwitch: document.getElementById('cfg-brand-sw').value,
        brandBoxThreshold: parseInt(document.getElementById('cfg-brand-thr').value) || 0,
        areaBoxSwitch: document.getElementById('cfg-area-sw').value,
        areaBoxThreshold: parseInt(document.getElementById('cfg-area-thr').value) || 0,
        shopListSwitch: document.getElementById('cfg-shoplist-sw').value
    };
}

/**
 * 3. プレビュー反映メイン処理
 */
function applyDataToPreview() {
    const brandRaw = document.getElementById('cfg-brand-data').value;
    const shopRaw = document.getElementById('cfg-shop-data').value;

    if (!brandRaw || !shopRaw) {
        alert("ブランドデータと店舗データを両方入力してください。");
        return;
    }

    try {
        // Numbers対応のパース関数を使用
        const brandsArr = parseFlexibleData(brandRaw);
        const shopsArr = parseFlexibleData(shopRaw);

        window.brandData = {};
        brandsArr.forEach(b => { 
            if(b.brand_id) window.brandData[b.brand_id] = b; 
        });

        window.shopData = shopsArr.map(s => ({
            ...s,
            brand: s.brand_id,
            lat: parseFloat(s.lat) || 0,
            lng: parseFloat(s.lng) || 0
        }));

        renderPreviewUI();
        generateOutputCode(); // 配布コードも自動更新
        alert("プレビューを更新しました！");

    } catch (e) {
        console.error(e);
        alert("データの解析に失敗しました。1行目の項目名が正しいか確認してください。");
    }
}

/**
 * 4. プレビューUI描画（WEB実装版を100%再現）
 * 沖縄の表示対応および情報の省略なし版です。
 */
function renderPreviewUI() {
    const $screen = $('#store-preview-screen');
    $screen.empty();
    const config = getSwitches();
    
    if (config.mainSwitch != 1) {
        $screen.html('<div style="padding:20px;text-align:center;color:#999;">メインスイッチがOFFです</div>');
        return;
    }

    // WEB版と同じデザインクラスを適用
    let html = '<div class="SyFLdCxCbsFfSEbKqHBjof" style="padding: 10px 0; background:#f5f5f5; min-height:100%; text-align:left;">';

    // A. 検索窓
    if (config.searchBoxSwitch == 1 && window.shopData.length >= config.searchBoxThreshold) {
        html += `<h3 class="titleh3 shop-search-title">店舗検索</h3><div class="shop-search-box" style="text-align:center;"><div class="search-box" style="width:90%; display:inline-block; position:relative;"><i class="fa fa-search search-icon" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#999;"></i><input type="text" placeholder="検索..." style="width:100%;padding:10px 10px 10px 35px;border-radius:8px;border:1px solid #ccc;"></div></div>`;
    }

    // B. BRANDバナー
    if (config.brandBoxSwitch == 1 && Object.keys(window.brandData).length >= config.brandBoxThreshold) {
        html += `<h3 class="titleh3 brand-box">BRAND</h3><div class="menu_banners scrollable">`;
        Object.keys(window.brandData).forEach(key => {
            const b = window.brandData[key];
            html += `<a href="#" class="menu_banner" data-brand="${key}"><div class="logo-box"><img src="${b.logo}" alt="${b.name}"></div><span>${b.name}</span></a>`;
        });
        html += `</div>`;
    }

    // C. エリア抽出（沖縄を確実に含む全網羅）
    if (config.areaBoxSwitch == 1) {
        const areaOrder = ['神奈川', '東京', '千葉', '埼玉', '静岡', '沖縄', '大阪'];
        const extractedAreas = areaOrder.filter(a => 
            window.shopData.some(s => s.address && s.address.indexOf(a) !== -1)
        );

        if (extractedAreas.length >= config.areaBoxThreshold) {
            html += `<h3 class="titleh3 area-box">エリアから探す</h3><div class="area-scroll">`;
            extractedAreas.forEach(a => {
                html += `<button class="area-banner">${a}</button>`;
            });
            html += `</div>`;
        }
    }

    // D. 店舗情報一覧（省略なし・カード構造の完全再現）
    if (config.shopListSwitch == 1) {
        html += `<h3 class="titleh3 shop-list-title">店舗情報一覧</h3><div class="search-results">`;
        window.shopData.forEach(s => {
            const b = window.brandData[s.brand] || {};
            html += `
                <div class="shop" style="display:flex; gap:12px; background:#fff; padding:12px; border-radius:12px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,0.05); align-items:flex-start;">
                    <div class="shop-logo" style="width:48px; flex-shrink:0;">
                        <img src="${b.logo || ''}" style="width:48px; height:48px; border-radius:50%; border:1px solid #ddd; padding:5px; object-fit:contain;">
                    </div>
                    <div class="shop-info" style="flex:1;">
                        <p class="shop-name" style="font-size:16px; margin:0 0 5px;"><strong>${s.name}</strong></p>
                        <p style="margin:0;"><a href="#" class="shop-address-link" style="color:#444; text-decoration:underline; font-size:14px;">${s.address}</a></p>
                        <p class="tel" style="margin:5px 0;"><a href="tel:${s.tel}" style="color:#333; text-decoration:none; font-size:14px;">📞 ${s.tel}</a></p>
                        ${s.hours ? `<p class="shop-hours" style="background:#f0f0f0; border-radius:7px; padding:10px; font-size:10px; line-height:1.5; margin:10px 0;">${s.hours}</p>` : ''}
                        <div class="shop-btns" style="display:flex; gap:10px; margin-top:10px;">
                            ${s.menu ? `<button class="shop-btn" style="flex:1; height:33px; border:1.5px solid #444; background:#fff; border-radius:8px; font-size:13px;">menu</button>` : ''}
                            ${s.reserve ? `<button class="reserve-btn" style="flex:1; height:33px; background:#f08519; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:bold;">RESERVATION</button>` : ''}
                        </div>
                    </div>
                </div>`;
        });
        html += `</div>`;
    }

    html += '</div>';
    $screen.append(html);
}

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function getNearestStation(lat, lng) {
        if (!lat || !lng) return null;
        let nearest = null;
        let minDist = Infinity;
        stations.forEach(st => {
            const dist = getDistance(lat, lng, st.lat, st.lng);
            if (dist < minDist) { minDist = dist; nearest = st; }
        });
        return nearest ? { name: nearest.name, distance: minDist } : null;
    }
