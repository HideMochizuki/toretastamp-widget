<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script src="common-ui.js"></script>
<script>
// --- 0. 変数定義 ---
let isInitializing = true;
let rankDesignSettings = {}; 
const RANK_CLASSES = ['normal', 'bronze', 'silver', 'gold', 'platinum', 'sapphire', 'emerald', 'ruby', 'diamond'];

// --- 1. 初期化 ---
window.addEventListener('DOMContentLoaded', () => {
    loadData();
    isInitializing = false; 
    calculateRanks();       
});

// --- 2. データの保存 ---
function saveData() {
    if (isInitializing) return;
    
    const rows = [];
    document.querySelectorAll('#rank-tbody tr').forEach(row => {
        rows.push({
            id: row.id,
            name: row.querySelector('.rank-name').value,
            max: row.querySelector('.rank-max').value,
            className: row.dataset.className
        });
    });

    localStorage.setItem('rankSettingsData', JSON.stringify({
        basic: { 
            normalId: document.getElementById('normal-id').value,
            platinumId: document.getElementById('platinum-id').value,
            totalNum: document.getElementById('total-num').value 
        },
        ranks: rows,
        designs: rankDesignSettings
    }));
    console.log("保存しました");
}

// --- 3. データの読み込み ---
function loadData() {
    isInitializing = true;
    const savedData = localStorage.getItem('rankSettingsData');
    if (savedData) {
        try {
            const data = JSON.parse(savedData);
            if (data.basic) {
                document.getElementById('normal-id').value = data.basic.normalId || '';
                document.getElementById('platinum-id').value = data.basic.platinumId || '';
                document.getElementById('total-num').value = data.basic.totalNum || '';
            }
            rankDesignSettings = data.designs || {};
            const tbody = document.getElementById('rank-tbody');
            tbody.innerHTML = ''; 
            data.ranks.forEach(r => {
                tbody.appendChild(createRowElement(r.id, r.name, r.max, r.className));
            });
        } catch (e) {
            console.error("データ読み込みエラー:", e);
        }
    }
    isInitializing = false;
    calculateRanks();
}

// --- 4. 行生成 ---
function createRowElement(id, name = '', max = '', className = '') {
    const tr = document.createElement('tr');
    tr.id = id;
    tr.dataset.className = className;
    
    // ③ .is-top-rank クラスの付与 (作成時にも適用)
    if (className === 'diamond') tr.classList.add('is-top-rank');

    tr.innerHTML = `
        <td><input type="text" class="data-input rank-name" placeholder="名称" value="${name}" oninput="saveData()"></td>
        <td class="rank-class-cell">${className}</td> 
        <td><input type="number" class="data-input rank-min" readonly style="width:60px; background:#f1f5f9;"></td>
        <td>
            <input type="number" class="data-input rank-max" placeholder="上限" style="width:60px" value="${max}" oninput="calculateRanks(); saveData();">
            <div class="error-msg" style="color:#ef4444; font-size:10px; margin-top:4px;"></div>
            <span class="rank-max-display">〜</span>
        </td>
        <td><button class="btn btn-sm" onclick="openDesignModal('${id}')" style="background:#64748b; color:white;"><i class="fa fa-palette"></i> 設定</button></td>
        <td><button class="btn btn-sm" onclick="removeRow('${id}')" style="background:#ef4444; color:white;"><i class="fa fa-trash"></i></button></td>
    `;
    return tr;
}

// --- 5. 計算ロジック ---
function calculateRanks() {
    const totalNum = parseInt(document.getElementById('total-num').value) || 0;
    const rows = document.querySelectorAll('#rank-tbody tr');
    const addBtn = document.getElementById('add-row-btn');
    
    let nextMin = 0;
    let lastMax = 0;
    let hasTopRank = false;
    let hasError = false;

    rows.forEach((row, index) => {
        const maxInput = row.querySelector('.rank-max');
        const errorMsg = row.querySelector('.error-msg');
        const minInput = row.querySelector('.rank-min');
        const classCell = row.querySelector('.rank-class-cell');
        
        let className = (index === 0) ? 'normal' : (RANK_CLASSES[index] || 'custom');
        
        // ダイアモンド判定
        if (index > 0 && lastMax >= totalNum && totalNum > 0) {
            className = 'diamond';
            hasTopRank = true;
        }
        
        row.dataset.className = className;
        if(classCell) classCell.textContent = className;
        
        // ③ .is-top-rank 切り替え
        if (className === 'diamond') row.classList.add('is-top-rank');
        else row.classList.remove('is-top-rank');

        minInput.value = nextMin;

        const currentMax = parseInt(maxInput.value);
        if (!isNaN(currentMax)) {
            lastMax = currentMax;
            // ① エラー表示
            if (totalNum > 0 && currentMax > totalNum) {
                maxInput.classList.add('input-error');
                if(errorMsg) errorMsg.textContent = `※${totalNum}以下にしてください`;
                hasError = true;
            } else {
                maxInput.classList.remove('input-error');
                if(errorMsg) errorMsg.textContent = '';
                nextMin = currentMax + 1;
            }
        }
    });

    if(addBtn) addBtn.style.display = (hasTopRank || hasError) ? 'none' : 'inline-block';
    
    // 残り数計算
    const remainingEl = document.getElementById('remaining-limit');
    if (remainingEl) {
        remainingEl.textContent = totalNum - lastMax;
    }
    
    if(document.getElementById('total-num-display')) document.getElementById('total-num-display').textContent = totalNum;
    updatePreview();
}

// --- 6. 行操作（ここを追加しました） ---
function addRankRow() {
    const tbody = document.getElementById('rank-tbody');
    const rowId = 'row-' + Date.now();
    tbody.appendChild(createRowElement(rowId, '', '', ''));
    calculateRanks();
    saveData();
}

function removeRow(rowId) {
    if(confirm('削除しますか？')) {
        const row = document.getElementById(rowId);
        if (row) {
            row.remove();
            calculateRanks();
            saveData();
        }
    }
}

// --- 7. デザイン設定モーダル ---
function openDesignModal(rowId) {
    currentEditingRowId = rowId;
    const data = rankDesignSettings[rowId] || { bg: '', color: '', bgImg: '', filter: '', border: '' };
    document.getElementById('modal-bg').value = data.bg;
    document.getElementById('modal-color').value = data.color;
    document.getElementById('modal-bg-img').value = data.bgImg;
    document.getElementById('modal-filter').value = data.filter || 'none';
    document.getElementById('modal-border').value = data.border || '#FFFFFF'; // デフォルト値
    document.getElementById('design-modal').style.display = 'flex';
}

function closeDesignModal() {
    document.getElementById('design-modal').style.display = 'none';
    currentEditingRowId = null;
}

function saveDesignModal() {
    if (!currentEditingRowId) return;
    rankDesignSettings[currentEditingRowId] = {
        bg: document.getElementById('modal-bg').value,
        color: document.getElementById('modal-color').value,
        bgImg: document.getElementById('modal-bg-img').value,
        filter: document.getElementById('modal-filter').value,
        border: document.getElementById('modal-border').value 
    };
    saveData();
    calculateRanks(); // 保存したら即プレビュー更新
    alert('デザイン設定を保存しました');
    closeDesignModal();
}

// --- 8. コード生成 ---
document.getElementById('generate-btn').addEventListener('click', generateCode);

function generateCode() {
    const totalNum = document.getElementById('total-num').value;
    const normalId = document.getElementById('normal-id').value;
    const platinumId = document.getElementById('platinum-id').value;
    
    const config = {
        ids: { normal: normalId, platinum: platinumId },
        maxStamps: parseInt(totalNum),
        ranks: []
    };

    // CSSの組み立て
    let cssOutput = `<style type="text/css">
#stamp-list > .stamp_set { overflow: hidden; }

/* =========================================
    スタンプカード (ヘッダーラベル)
========================================= */\n
`;

    // ランクごとの設定ループ
    document.querySelectorAll('#rank-tbody tr').forEach(row => {
        const name = row.querySelector('.rank-name').value;
        const className = row.dataset.className;
        const max = row.querySelector('.rank-max').value ? parseInt(row.querySelector('.rank-max').value) : null;
        const design = rankDesignSettings[row.id] || {};
        
        config.ranks.push({ name, className, max, design });

        cssOutput += `body.stamp_card .stamp_set.${className} .stamp_title::before { content: "【${name}】"; margin-right: 5px; }\n`;
    });

    cssOutput += `\n/* =========================================
    スタンプ一覧 (カード本体)
========================================= */\n`;

    document.querySelectorAll('#rank-tbody tr').forEach(row => {
        const name = row.querySelector('.rank-name').value;
        const className = row.dataset.className;
        const design = rankDesignSettings[row.id] || {};
        
        let bgStyle = design.bgImg ? `background-image: url('${design.bgImg}'); background-size: cover;` : `background: ${design.bg};`;

        cssOutput += `
/* ${name} */
#stamp-list > .stamp_set > .stamp_card.${className} { ${bgStyle} }
#stamp-list > .stamp_set > .stamp_card.${className} .stamp_list_title { color: ${design.color || '#333333'} !important; border-bottom: 1px dashed ${design.color || '#333333'}; }
#stamp-list > .stamp_set > .stamp_card.${className} .stamp_list_title:before { content: "【${name}】"; }
#stamp-list > .stamp_set > .stamp_card.${className} .ticket_list_due { background: rgb(255 255 255 / 35%); border: none; color: #FFFFFF; }
#stamp-list > .stamp_set > .stamp_card.${className} .stampicon { color: #FFFFFF; }
#stamp-list > .stamp_set > .stamp_card.${className} .stampicon > b { border: 2px solid ${design.border || '#FFFFFF'}; }
#stamp-list > .stamp_set > .stamp_card.${className} .stampicon > b > span { filter: ${design.filter || 'none'}; }
`;
    });

    cssOutput += `<\/style>`;

    // JSテンプレート（前回と同じ内容です）
    const jsTemplate = `<script>
const STATUS_CONFIG = ${JSON.stringify(config, null, 2)};

$(document).ready(function () {
    const stampCardIds = STATUS_CONFIG.ids;
    const $normalSet = $('.stamp_set.' + stampCardIds.normal);
    const $platinumSet = stampCardIds.platinum ? $('.stamp_set.' + stampCardIds.platinum) : $();

    $('.stamp_card a').each(function () {
        const href = $(this).attr('href');
        const match = href.match(/stamp_card\\/([a-zA-Z0-9]+)/);
        if (match && match[1]) { $(this).closest('.stamp_set').addClass(match[1]); }
    });

    $platinumSet.find('.stamp_card').each(function () {
        if ($(this).find('.stamp_card_delete_btn').length === 0) { $(this).addClass('d-normal'); }
    });

    $('.stamp_set .stamp_num').each(function () {
        const text = $(this).text().trim();
        let match = text.match(/(\\d+)\\s*\\/\\s*(\\d+)/);
        let firstNum = match ? parseInt(match[1], 10) : parseInt(text.match(/(\\d+)/)?.[1], 10);
        let secondNum = match ? parseInt(match[2], 10) : STATUS_CONFIG.maxStamps;
        if (firstNum != null && secondNum != null && firstNum >= secondNum) {
            $(this).addClass('acquisition').closest('.stamp_card').addClass('acquisition');
        }
    }); 

    handleAandB();

    function handleAandB() {
        const $cards = $normalSet.find('.stamp_card');
        let isFullExists = false;
        $cards.each(function () {
            const text = $(this).find('.stamp_num').text().replace(/[^\\d\\/]/g, '').trim();
            const match = text.match(/(\\d+)\\s*\\/\\s*(\\d+)/);
            if (match && parseInt(match[1], 10) >= parseInt(match[2], 10)) { isFullExists = true; return false; }
        });

        if (isFullExists && $platinumSet.length) {
            $platinumSet.closest('.stamp_set').show();
            $normalSet.closest('.stamp_set').hide();
        } else {
            $normalSet.closest('.stamp_set').show();
            handleAOnly();
        }
    }

    function handleAOnly() {
        const $cards = $normalSet.find('.stamp_card');
        let showCard = null, fallbackCard = null;
        const today = new Date(); today.setHours(0, 0, 0, 0);

        $cards.each(function () {
            const $card = $(this);
            const text = $card.find('.ticket_list_due').text();
            if (text.includes('なし')) { showCard = $card; return false; }
            const dateMatch = text.match(/(\\d{4})年(\\d{2})月(\\d{2})日/);
            if (dateMatch) {
                const date = new Date(dateMatch[0].replace(/[年月]/g, '/').replace('日', ''));
                if (date >= today) { showCard = $card; return false; }
            }
            if (!fallbackCard && $card.find('.stamp_card_delete_btn').length === 0) fallbackCard = $card;
        });
        assignRankAndMessage(showCard || fallbackCard);
    }

    function assignRankAndMessage($card) {
        if (!$card || $card.length === 0) return;
        
        const text = $card.find('.stamp_num').text().trim();
        let match = text.match(/(\\d+)/);
        let obtained = match ? parseInt(match[1], 10) : 0;
        
        let matchedClass = 'normal';
        let lower = 0;
        
        STATUS_CONFIG.ranks.forEach(rank => {
            let upper = rank.max !== null ? parseInt(rank.max) : Infinity;
            if (obtained >= lower && obtained <= upper) {
                matchedClass = rank.className;
            }
            lower = upper + 1;
        });

        const allClasses = STATUS_CONFIG.ranks.map(r => r.className).join(' ');
        $card.removeClass('normal ' + allClasses).addClass(matchedClass);
        
        if ($platinumSet.length && obtained >= STATUS_CONFIG.maxStamps) {
            $card.removeClass('normal ' + allClasses).addClass('diamond');
        }
    }
});
<\/script>`;

    document.getElementById('out-js').value = jsTemplate;
    document.getElementById('out-css').value = cssOutput;
    showToast("配布用コードを生成しました！");
}

// --- 9. プレビュー ---
function updatePreview() {
    const container = document.getElementById('preview-content');
    const styleTag = document.getElementById('preview-style');
    
    container.innerHTML = '';
    let cssText = "";

    document.querySelectorAll('#rank-tbody tr').forEach(row => {
        const name = row.querySelector('.rank-name').value;
        const className = row.dataset.className;
        const maxVal = row.querySelector('.rank-max').value;
        const design = rankDesignSettings[row.id] || { bg: '#ffffff', color: '#000000', filter: 'none', border: '#FFFFFF' };
        
        let cleanBg = design.bg;
        if (cleanBg && cleanBg.endsWith(';')) cleanBg = cleanBg.slice(0, -1);
        
        const bgStyle = design.bgImg ? 
            `background-image: url('${design.bgImg}'); background-size: cover;` : 
            `background: ${cleanBg};`;
        
        const maxDisplay = maxVal ? ` / ${maxVal}` : "";

        const cardHtml = `
            <div class="stamp_set" style="margin: 0 0 20px 0; padding:0;">
                <div class="stamp_card ${className}" id="preview-${row.id}">
                    <a href="#" class="clearfix" style="text-decoration:none; display:block; padding:10px;">
                        <h3 class="stamp_list_title" style="margin:0;">【${name}】スタンプカード</h3>
                        <dl class="ticket_list_bottom">
                            <dt><span class="ticket_list_due" style="font-size:10px;">有効期限：2026年02月01日</span></dt>
                        </dl>
                        <dl class="ticket_list_bottom stamp">
                            <dt class="stampicon"><b><span></span></b> 0${maxDisplay} 獲得</dt>
                        </dl>
                    </a>
                </div>
            </div>
        `;
        container.innerHTML += cardHtml;

        // ★ここでCSSを反映
        cssText += `
            #preview-${row.id} { ${bgStyle} color: ${design.color || '#333'}; border-radius: 8px; }
            #preview-${row.id} .stamp_list_title { color: ${design.color || '#333'} !important; }
            #preview-${row.id} .stampicon { color: ${design.color || '#333'} !important; }
            #preview-${row.id} .stampicon > b { border: 2px solid ${design.border || '#FFFFFF'} !important; }
            /* ★ filter: を1回だけ記述し、最後に !important を追加 */
            #preview-${row.id} .stampicon > b > span { filter: ${design.filter || 'none'} !important; }
        `;
    });

    styleTag.textContent = cssText;
}


</script>

<div id="design-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
    <div class="card" style="width: 400px; max-width: 90%; background:#fff; padding:20px; border-radius:12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div class="card-sub-title" style="margin-bottom:20px; font-weight:bold; color:#1e293b;">詳細デザイン設定</div>
        <div class="form-row"><label>背景設定</label><input type="text" id="modal-bg" class="data-input" placeholder="#ffffff または linear-gradient(...)" ></div>
        <div class="form-row"><label>文字色</label><input type="text" id="modal-color" class="data-input" placeholder="#000000"></div>
        <div class="form-row"><label>背景画像URL</label><input type="text" id="modal-bg-img" class="data-input" placeholder="https://..."></div>
        <div class="form-row"><label>ボーダー色</label><input type="text" id="modal-border" class="data-input" placeholder="#ffffff"></div>
        <div class="form-row">
            <label>アイコン色</label>
            <select id="modal-filter" class="data-input">
                <option value="none">そのまま（デフォルト）</option>
                <option value="invert(100%)">白</option>
                <option value="invert(0%)">黒</option>
            </select>
        </div>

        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button class="btn" style="background:#94a3b8; color:#fff; flex:1; padding:12px; border-radius:6px; border:none; cursor:pointer; font-weight:bold;" onclick="closeDesignModal()">
                キャンセル
            </button>
            <button class="btn" style="background:#1e293b; color:#fff; flex:1; padding:12px; border-radius:6px; border:none; cursor:pointer; font-weight:bold;" onclick="saveDesignModal()">
                保存
            </button>
        </div>
    </div>
</div>
