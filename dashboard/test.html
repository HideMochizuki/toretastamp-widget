const tests = [];
function test(name, fn) { tests.push({ name, fn }); }

function assertEqual(actual, expected, label) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${label || '値が一致しません'}\n  期待値: ${e}\n  実際値: ${a}`);
}

function assertTrue(value, label) {
  if (!value) throw new Error(label || '真であるべき値が偽でした');
}

test('util: parseMonthFromFileName で月単位/全期間のファイル名から年月キーを取り出せる', () => {
  assertEqual(Dashboard.Util.parseMonthFromFileName('すべてのログ2026-10.csv'), '2026-10', '月単位(1桁月)');
  assertEqual(Dashboard.Util.parseMonthFromFileName('すべてのログ2026-9.csv'), '2026-09', '月単位(0埋め)');
  assertEqual(Dashboard.Util.parseMonthFromFileName('すべてのログ.csv'), 'all', '全期間1ファイルのときは特別なキーall');
  assertEqual(Dashboard.Util.parseMonthFromFileName('ログ.csv'), null, '対応していない名前はnull');
});

test('util: parseDateTime はスラッシュ区切り・ハイフン区切りのどちらの日時も読める', () => {
  assertEqual(Dashboard.Util.parseDateTime('2026/10/9 17:39').toISOString(), new Date(2026, 9, 9, 17, 39, 0).toISOString(), 'スラッシュ区切り(秒なし)');

  assertEqual(Dashboard.Util.parseDateTime('2026-9-1').toISOString(), new Date(2026, 8, 1, 0, 0, 0).toISOString(), 'ハイフン区切り・時刻なし');
});

    'エリア番号': '', 'エリア名': '', '店舗番号': '100', '店舗名': 'テスト店',
    'スタンプページ番号': '1', 'スタンプページ名称': 'ドリンクカード', '初回スタンプ利用フラグ': '',
    'チケット番号': '', 'チケット名称': '', '会員ID': '', 'メールアドレス': '', 'LINE ID': '',
    '件名': '', '通常配信ID': '', 'リッチメッセージID': '', 'ポイント': '', 'パスコード': '',
  };
  return [
    { ...base, '日時': '2026/10/1 10:00', 'イベント': 'スタンプ押下', '会員ID': 'member-A' },
    { ...base, '日時': '2026/10/1 11:00', 'イベント': 'スタンプ押下', '会員ID': 'member-B' },
    { ...base, '日時': '2026/10/2 09:00', 'イベント': 'トップページ表示', '会員ID': 'member-A' },
    { ...base, '日時': '2026/10/3 09:00', 'イベント': 'チケット発行', 'チケット番号': 'T1', 'チケット名称': '無料券', '会員ID': 'member-A' },
    { ...base, '日時': '2026/10/4 09:00', 'イベント': 'チケット利用', 'チケット番号': 'T1', '会員ID': 'member-A' },
  ];
}

test('aggregate: イベント件数・ブランド別・店舗別・スタンプページ別の集計が合う', () => {
  const agg = Dashboard.Aggregate.aggregateAccessLogRows(fixtureRows());
  assertEqual(agg.byDay['2026-10-01'].total['スタンプ押下'], 2, '日別・総件数');
  assertEqual(agg.byDay['2026-10-01'].byBrand['テストブランド']['スタンプ押下'], 2, 'ブランド別');
  assertEqual(agg.byDay['2026-10-01'].byStore['100:テスト店']['スタンプ押下'], 2, '店舗別');
  assertEqual(agg.byDay['2026-10-01'].byStampPage['ドリンクカード']['スタンプ押下'], 2, 'スタンプページ別');
  assertEqual(agg.byDay['2026-10-01'].byStoreStampPage['100:テスト店']['ドリンクカード']['スタンプ押下'], 2, '店舗×スタンプページ別');
});

test('aggregate: queryByStampPage が店舗で絞り込める', () => {
  const agg = Dashboard.Aggregate.aggregateAccessLogRows(fixtureRows());
  const all = Dashboard.Aggregate.queryByStampPage(agg.byDay, {});
  assertEqual(all['ドリンクカード']['スタンプ押下'], 2, '全店舗合算');
  const byStore = Dashboard.Aggregate.queryByStampPage(agg.byDay, { storeKey: '100:テスト店' });
  assertEqual(byStore['ドリンクカード']['スタンプ押下'], 2, '店舗で絞っても同じ店なので変わらない');
  const noStore = Dashboard.Aggregate.queryByStampPage(agg.byDay, { storeKey: '999:別の店' });
  assertEqual(Object.keys(noStore).length, 0, '該当しない店舗を指定すると空になる');
});

test('aggregate: queryCounts で期間・店舗を絞り込める', () => {
  const agg = Dashboard.Aggregate.aggregateAccessLogRows(fixtureRows());
  const all = Dashboard.Aggregate.queryCounts(agg.byDay, {});
  assertEqual(all['スタンプ押下'], 2, '全期間合算');
  const oneDay = Dashboard.Aggregate.queryCounts(agg.byDay, { from: new Date(2026, 9, 1), to: new Date(2026, 9, 1) });
  assertEqual(oneDay['スタンプ押下'], 2, '10/1だけに絞る');
  const noMatch = Dashboard.Aggregate.queryCounts(agg.byDay, { from: new Date(2026, 9, 2), to: new Date(2026, 9, 2) });
  assertEqual(noMatch['スタンプ押下'], undefined, '10/2にはスタンプ押下がない');
  const byStore = Dashboard.Aggregate.queryCounts(agg.byDay, { storeKey: '100:テスト店' });
  assertEqual(byStore['スタンプ押下'], 2, '店舗で絞る');
});

test('aggregate: countRegistrationsByPeriod で日/月/年×店舗を絞り込める', () => {
  const rows = [
    { '会員ID': 'm1', 'LINE ID': 'U1', '退会': '0', '初回登録店舗番号': '100', '初回登録店舗名': 'A店', '登録日時': '2026/10/1 10:00' },
    { '会員ID': 'm2', 'LINE ID': 'U2', '退会': '0', '初回登録店舗番号': '100', '初回登録店舗名': 'A店', '登録日時': '2026/10/5 10:00' },
    { '会員ID': 'm3', 'LINE ID': 'U3', '退会': '0', '初回登録店舗番号': '200', '初回登録店舗名': 'B店', '登録日時': '2026/9/1 10:00' },
  ];
  const summary = Dashboard.Aggregate.summarizeMemberList(rows);

  const byMonth = Dashboard.Aggregate.countRegistrationsByPeriod(summary.members, 'month');
  assertEqual(byMonth['2026-10'], 2, '全店舗・月別(10月は2人)');
  assertEqual(byMonth['2026-09'], 1, '全店舗・月別(9月は1人)');

  const byMonthStoreA = Dashboard.Aggregate.countRegistrationsByPeriod(summary.members, 'month', '100:A店');
  assertEqual(byMonthStoreA['2026-10'], 2, 'A店だけに絞ると10月2人');
  assertEqual(byMonthStoreA['2026-09'], undefined, 'A店には9月の登録者はいない');

  const byDay = Dashboard.Aggregate.countRegistrationsByPeriod(summary.members, 'day', '100:A店');
  assertEqual(byDay['2026-10-01'], 1, '日別・A店(10/1)');
  assertEqual(byDay['2026-10-05'], 1, '日別・A店(10/5)');
});

test('aggregate: findLapsedRegulars で常連だったが最近来ていない会員を抽出できる', () => {
  const asOf = new Date(2026, 9, 1); // 2026-10-01基準
  const stampPushes = [
    // regular-lapsed: 来店5回、最終来店が60日前 → 常連だが離脱予兆
    { memberId: 'regular-lapsed', at: new Date(2026, 7, 2).toISOString() },
    { memberId: 'regular-lapsed', at: new Date(2026, 7, 5).toISOString() },
    { memberId: 'regular-lapsed', at: new Date(2026, 7, 10).toISOString() },
    { memberId: 'regular-lapsed', at: new Date(2026, 7, 15).toISOString() },
    { memberId: 'regular-lapsed', at: new Date(2026, 7, 3).toISOString() },
    // regular-active: 来店5回だが最近(5日前)も来ている → 離脱予兆ではない
    { memberId: 'regular-active', at: new Date(2026, 7, 2).toISOString() },
    { memberId: 'regular-active', at: new Date(2026, 7, 5).toISOString() },
    { memberId: 'regular-active', at: new Date(2026, 7, 10).toISOString() },
    { memberId: 'regular-active', at: new Date(2026, 7, 15).toISOString() },
    { memberId: 'regular-active', at: new Date(2026, 8, 26).toISOString() },
    // one-timer: 来店1回だけで60日前 → 常連ではないので対象外
    { memberId: 'one-timer', at: new Date(2026, 7, 2).toISOString() },
  ];

  const result = Dashboard.Aggregate.findLapsedRegulars(stampPushes, 3, 30, asOf);
  assertEqual(result.length, 1, '離脱予兆として抽出されるのは1人だけ');
  assertEqual(result[0].memberId, 'regular-lapsed', '抽出されるのはregular-lapsed');
  assertEqual(result[0].pushCount, 5, '来店回数が引き継がれる');
  assertEqual(result[0].daysSinceLastVisit, 47, '最終来店日(8/15)からasOf(10/1)までの経過日数');
});

test('aggregate: mergeMemberSummaries で会員一覧を複数ファイルに分割していても束ねられる', () => {
  const file1 = Dashboard.Aggregate.summarizeMemberList([
    { '会員ID': 'm1', 'LINE ID': 'U1', '退会': '0', '初回登録店舗番号': '1', '初回登録店舗名': 'A店', '登録日時': '2026/10/1 10:00' },
    { '会員ID': 'm2', 'LINE ID': '', '退会': '1', '初回登録店舗番号': '1', '初回登録店舗名': 'A店', '登録日時': '2026/10/2 10:00' },
  ]);
  const file2 = Dashboard.Aggregate.summarizeMemberList([
    { '会員ID': 'm3', 'LINE ID': 'U3', '退会': '0', '初回登録店舗番号': '2', '初回登録店舗名': 'B店', '登録日時': '2026/10/3 10:00' },
  ]);

  const merged = Dashboard.Aggregate.mergeMemberSummaries([file1, file2]);
  assertEqual(merged.total, 3, '複数ファイル分を合わせた総会員数');
  assertEqual(merged.withdrawn, 1, '退会者数も合算される');
  assertEqual(merged.lineMembers, 2, 'LINE会員数も合算される');

test('aggregate: calcMonthlyPushByCohort は初回来店月(=初めてスタンプを押した月)を基準に新規/既存を判定できる', () => {
  const stampPushes = [
    // member-a: 9月が初回来店月 → 9月は新規
    { memberId: 'member-a', at: new Date(2026, 8, 5).toISOString(), storeKey: 'A' },
    { memberId: 'member-a', at: new Date(2026, 8, 20).toISOString(), storeKey: 'A' },
    // member-b: 7月が初回来店月。9月にも来店 → 9月は既存
    { memberId: 'member-b', at: new Date(2026, 6, 1).toISOString(), storeKey: 'A' },
    { memberId: 'member-b', at: new Date(2026, 8, 10).toISOString(), storeKey: 'A' },
    // member-c: 初回来店はB店(8月)。9月はA店で来店。
    // 「来店回数はブランド全体でカウント」する定義のため、店舗Aだけで絞り込んでも
    // 初回来店月の判定(=8月)は変わらず、9月は既存として数えられる。
    { memberId: 'member-c', at: new Date(2026, 7, 1).toISOString(), storeKey: 'B' },
    { memberId: 'member-c', at: new Date(2026, 8, 15).toISOString(), storeKey: 'A' },
  ];

  const result = Dashboard.Aggregate.calcMonthlyPushByCohort(stampPushes, 'A');
  assertEqual(result.byMonth['2026-07'].newPushCount, 1, '7月: member-bの初回来店(新規)');
  assertEqual(result.byMonth['2026-08'], undefined, '店舗Aで絞り込むとmember-cの8月(店舗B)の来店は出てこない');
  assertEqual(result.byMonth['2026-09'].newPushCount, 2, '9月の新規押下数(member-aの2回)');
  assertEqual(result.byMonth['2026-09'].newUniqueCount, 1, '9月の新規ユニーク人数(member-a)');
  assertEqual(result.byMonth['2026-09'].existingPushCount, 2, '9月の既存押下数(member-b, member-cがそれぞれ1回)');
  assertEqual(result.byMonth['2026-09'].existingUniqueCount, 2, '9月の既存ユニーク人数(初回来店が9月より前のmember-bとmember-c)');

  const resultAllStores = Dashboard.Aggregate.calcMonthlyPushByCohort(stampPushes, null);
  assertEqual(resultAllStores.byMonth['2026-08'].newPushCount, 1, '全店舗で見るとmember-cの8月の来店(新規)も出てくる');
});

test('aggregate: calcRegisteredVsActualStore で登録店舗と実利用店舗(押下が一番多い店舗)を比較できる', () => {
  const members = {
    'm1': { lineId: 'U1', storeKey: 'A' },
    'm2': { lineId: 'U2', storeKey: 'A' },
    'm3': { lineId: 'U3', storeKey: 'B' },
  };
  const stampPushes = [
    // m1: 登録はA店だが、実際はB店で一番多く押下 → 店舗をまたいでいる
    { memberId: 'm1', storeKey: 'B' }, { memberId: 'm1', storeKey: 'B' }, { memberId: 'm1', storeKey: 'A' },
    // m2: 登録・実利用ともにA店 → 一致
    { memberId: 'm2', storeKey: 'A' }, { memberId: 'm2', storeKey: 'A' },
    // m4: 会員一覧に無いID → 突合できず対象外(unmatchedCountへ)
    { memberId: 'm4', storeKey: 'A' },
    // m3: スタンプ押下の記録が無いので対象外(集計に出てこない)
  ];

  const result = Dashboard.Aggregate.calcRegisteredVsActualStore(stampPushes, members);
  assertEqual(result.members['m1'].registeredStoreKey, 'A', 'm1の登録店舗');
  assertEqual(result.members['m1'].actualStoreKey, 'B', 'm1の実利用店舗(最多)');
  assertEqual(result.members['m1'].actualPushCount, 2, 'm1の実利用店舗での押下数');
  assertEqual(result.members['m1'].isSame, false, 'm1は登録店舗と実利用店舗が違う');
  assertEqual(result.members['m2'].isSame, true, 'm2は登録店舗と実利用店舗が同じ');
  assertEqual(result.members['m3'], undefined, 'm3は押下記録が無いので対象外');

  assertEqual(result.byRegisteredStore['A'].total, 2, 'A店登録・押下実績ありの会員数');
  assertEqual(result.byRegisteredStore['A'].same, 1, 'A店登録のうち同じ店舗で利用');
  assertEqual(result.byRegisteredStore['A'].different, 1, 'A店登録のうち他店舗で利用');
  assertEqual(result.matchedCount, 2, '会員一覧と突合できた会員数');
  assertEqual(result.unmatchedCount, 1, '会員一覧と突合できなかった会員数');
});

function renderResults(results) {
  const el = document.getElementById('results');
  el.innerHTML = '';
  results.forEach(r => {
    const div = document.createElement('div');
    div.className = `test-item ${r.pass ? 'test-pass' : 'test-fail'}`;
    div.innerHTML = `
      <div class="test-mark">${r.pass ? '✓' : '✗'}</div>
      <div>
        <div class="test-name">${r.name}</div>
        ${r.pass ? '' : `<div class="test-detail">${r.detail}</div>`}
      </div>`;
    el.appendChild(div);
  });
  const passCount = results.filter(r => r.pass).length;
  document.getElementById('summary').textContent = `${passCount} / ${results.length} 件 成功`;
  document.getElementById('summary').style.color = passCount === results.length ? '#16a34a' : '#dc2626';
}

document.getElementById('run-btn').addEventListener('click', () => {
  const results = tests.map(t => {
    try {
      t.fn();
      return { name: t.name, pass: true };
    } catch (e) {
      return { name: t.name, pass: false, detail: e.message };
    }
  });
  renderResults(results);
});
