<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チケット設定 | 解析ダッシュボード</title>
<link rel="icon" href="https://hidemochizuki.github.io/toretastamp-widget/generator/img/favicon.ico">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="../generator/style.css">
<style>
  .main-wrapper { flex-direction: column; max-width: 1100px; margin: 0 auto; width: 100%; padding: 30px; }
  .step-buttons { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .status-line { font-size: 0.85rem; color: #64748b; margin-top: 10px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-right: 7px; vertical-align: -2px;
    border: 2px solid #cbd5e1; border-top-color: var(--primary-color); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .warn { color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 10px 14px; margin-top: 10px; font-size: 0.85rem; }
  .not-supported { color: #dc2626; font-weight: bold; }
  .summary-row { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; }
  .summary-tile { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 20px; min-width: 140px; }
  .summary-tile .num { font-size: 1.4rem; font-weight: bold; color: #1e293b; }
  .summary-tile .label { font-size: 0.75rem; color: #64748b; }
  table.ticket-table { border-collapse: collapse; width: 100%; font-size: 0.85rem; margin-top: 15px; }
  table.ticket-table th, table.ticket-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  table.ticket-table th { color: #475569; font-size: 0.75rem; text-transform: uppercase; }
  .needs-config { background: #fff7ed; }
  tr.excluded-row { opacity: 0.5; background: #f8fafc; }
  select, input[type="number"], input[type="date"] { font-size: 0.85rem; }
  .value-input { width: 110px; }
  .action-btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 22px; font-size: 0.85rem; font-weight: bold;
    border: none; border-radius: 4px; cursor: pointer; color: #fff; white-space: nowrap;
  }
  .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .action-btn.primary { background: var(--primary-color); }
  .action-btn.secondary { background: #475569; }
</style>
</head>
<body>

<header class="generator">
  <button id="sidebar-toggle" class="sidebar-toggle"><i class="fa fa-bars"></i></button>
  <img src="https://toretastamp-prod.s3.amazonaws.com/static/management/img/brand/logo_bass.png" alt="Logo">
  <div style="font-weight: bold;">トレタスタンプ 解析ダッシュボード</div>
  <div class="top-loading-bar" id="top-loading-bar"></div>
</header>

<div class="app-container">
  <div class="sidebar" style="width: 200px;">
    <nav>
      <a href="index.html" class="nav-item">
        <i class="fa fa-chart-line"></i> ホーム
      </a>
      <a href="tickets.html" class="nav-item active">
        <i class="fa fa-ticket"></i> チケット設定
      </a>
      <a href="business-hours.html" class="nav-item">
        <i class="fa fa-clock"></i> 営業時間設定
      </a>
      <a href="test-members.html" class="nav-item">
        <i class="fa fa-user-slash"></i> テスト会員設定
      </a>
      <a href="suspicious-access.html" class="nav-item">
        <i class="fa fa-triangle-exclamation"></i> 不正アクセス検証
      </a>
      <a href="help.html" class="nav-item">
        <i class="fa fa-circle-question"></i> 使い方
      </a>
    </nav>
  </div>

<main class="main-wrapper">
  <div class="card-wrapper">
    <h2 class="card-title">フォルダを読み込む</h2>
    <div class="card">
      <div class="card-sub-title">ログを読み込んだ上で、チケットごとの有効期限を登録します</div>
      <div id="support-check"></div>
      <div class="step-buttons">
        <button class="action-btn primary" id="pick-btn">
          <i class="fa fa-folder-open"></i> ① フォルダを選択
        </button>
        <button class="action-btn secondary" id="sync-btn" disabled>
          <i class="fa fa-rotate"></i> ② 読み込み
        </button>
        <select id="client-select" style="display:none; height: 38px;"></select>
      </div>
      <div class="status-line" id="status">フォルダ未選択です。</div>
    </div>
  </div>

  <div class="card-wrapper" id="ticket-card" style="display:none;">
    <h2 class="card-title">チケット種類ごとの有効期限</h2>
    <div class="card">
      <div class="card-sub-title">未使用のチケットには有効期限カテゴリーを登録してください。使用済みのチケットは判定対象外のため設定不要です。</div>
      <div class="card-sub-title" style="margin-top: -15px;">
        左端の「レポートに含める」のチェックを外すと、デモ検証用など本番の集計に含めたくないチケット種類を、
        ホーム・不正アクセス検証ページのチケット関連の集計から除外できます（既定はすべてチェック済み）。
      </div>
      <div id="warnings"></div>
      <div class="summary-row" id="summary-row"></div>
      <div style="display:flex; gap:10px; margin-top: 15px;">
        <button type="button" class="action-btn secondary" id="include-all-btn" style="height:30px; padding:0 14px; font-size:0.8rem;">すべて含める</button>
        <button type="button" class="action-btn secondary" id="exclude-all-btn" style="height:30px; padding:0 14px; font-size:0.8rem;">すべて除外</button>
      </div>
      <table class="ticket-table" id="ticket-table"></table>
      <button class="action-btn primary" id="save-btn" style="margin-top: 20px;">
        <i class="fa fa-save"></i> 保存
      </button>
      <span class="status-line" id="save-status"></span>
    </div>
  </div>
</main>
</div>

<script src="js/util.js"></script>
<script src="js/csv-parser.js"></script>
<script src="js/aggregate.js"></script>
<script src="js/tickets.js"></script>
<script src="js/effect.js"></script>
<script src="js/compare.js"></script>
<script src="js/io/filesystem.js"></script>
<script src="js/io/sync.js"></script>
<script src="js/ui.js"></script>
<script>
const CATEGORY_LABELS = {
  none: '有効期限なし',
  fixed_date: '日付・時間指定',
  days_from_issue: '発効日からX日',
  issue_day_only: '発効日当日のみ',
};

let rootHandle = null;
let clients = [];
let currentClient = null;

const statusEl = document.getElementById('status');
const topLoadingBar = document.getElementById('top-loading-bar');
const syncBtn = document.getElementById('sync-btn');
const clientSelect = document.getElementById('client-select');
const ticketCard = document.getElementById('ticket-card');
const warningsEl = document.getElementById('warnings');
const summaryRowEl = document.getElementById('summary-row');
const ticketTableEl = document.getElementById('ticket-table');
const saveStatusEl = document.getElementById('save-status');

if (!Dashboard.FS.isSupported()) {
  document.getElementById('support-check').innerHTML =
    '<div class="not-supported">⚠️ このブラウザはFile System Access APIに対応していません。Chrome/Edgeで開いてください。</div>';
}

async function doSync() {
  statusEl.innerHTML = '<span class="spinner"></span>読み込み中...';
  topLoadingBar.classList.add('active');
  try {
    clients = await Dashboard.Sync.syncAllClients(rootHandle);
    statusEl.textContent = `読み込み完了（${clients.length}クライアント、フォルダ:「${rootHandle.name}」）`;
    if (!clients.length) {
      ticketCard.style.display = 'none';
      return;
    }
    clientSelect.style.display = '';
    clientSelect.innerHTML = clients.map((c, i) => `<option value="${i}">${escapeHtml(c.name)}</option>`).join('');
    const initialIndex = Math.max(0, clients.findIndex(c => c.name === Dashboard.Util.getLastClientName()));
    clientSelect.value = String(initialIndex);
    selectClient(initialIndex);
  } catch (e) {
    statusEl.textContent = 'エラー: ' + e.message;
  } finally {
    topLoadingBar.classList.remove('active');
  }
}

document.getElementById('pick-btn').addEventListener('click', async () => {
  try {
    rootHandle = await Dashboard.FS.pickRootFolder();
    statusEl.textContent = `選択中のフォルダ: 「${rootHandle.name}」`;
    syncBtn.disabled = false;
    await doSync();
  } catch (e) {
    statusEl.textContent = 'フォルダ選択がキャンセルされたか、エラーが発生しました: ' + e.message;
  }
});

syncBtn.addEventListener('click', doSync);

clientSelect.addEventListener('change', () => selectClient(Number(clientSelect.value)));

(async () => {
  if (!Dashboard.FS.isSupported()) return;
  const saved = await Dashboard.FS.getSavedHandle();
  if (!saved) return;

  rootHandle = saved;
  syncBtn.disabled = false;

  if (await Dashboard.FS.hasPermission(saved)) {
    statusEl.textContent = `前回のフォルダ「${saved.name}」を自動復元しました`;
    await doSync();
  } else {
    statusEl.innerHTML = `前回のフォルダ「${escapeHtml(saved.name)}」の権限が切れています。`
      + `<button id="resume-btn" class="action-btn secondary" style="height:28px; padding:0 12px; margin-left:8px;">許可して読み込む</button>`;
    document.getElementById('resume-btn').addEventListener('click', async () => {
      const granted = await Dashboard.FS.requestPermissionForHandle(saved);
      if (granted) { await doSync(); }
      else { statusEl.textContent = '許可されませんでした。①から選び直してください。'; }
    });
  }
})();

function selectClient(index) {
  currentClient = clients[index];
  Dashboard.Util.setLastClientName(currentClient.name);
  ticketCard.style.display = '';
  renderWarnings();
  renderTicketTable();
}

function renderWarnings() {
  warningsEl.innerHTML = currentClient.warnings
    .map(w => `<div class="warn">⚠️ ${escapeHtml(w)}</div>`).join('');
}

// 未設定(masterConfig={})で一度集計すると、「使用済み(inactive)=設定不要」「未使用(unconfigured)=要設定」の
// 内訳をそのままチケット種類ごとのカタログとして使い回せる。
function buildCatalog() {
  return Dashboard.Tickets.calcTicketValidity(currentClient.ticketLedger, {}, new Date());
}

function renderSummary(validity) {
  const tiles = [
    { label: '有効チケット', num: validity.activeCount },
    { label: '失効/使用済み', num: validity.inactiveCount },
    { label: '未設定（計算対象外）', num: validity.unconfiguredCount },
  ];
  summaryRowEl.innerHTML = tiles.map(t => `
    <div class="summary-tile"><div class="num">${t.num.toLocaleString()}</div><div class="label">${t.label}</div></div>
  `).join('');
}

function renderTicketTable() {
  const catalog = buildCatalog();
  const config = { ...currentClient.ticketConfig };

  const rows = Object.entries(catalog.byTicketNo)
    .sort((a, b) => (b[1].inactive + b[1].unconfigured) - (a[1].inactive + a[1].unconfigured));

  ticketTableEl.innerHTML = `
    <tr>
      <th>レポートに含める</th><th>チケット名称</th><th>チケット番号</th><th>発行数</th><th>未使用(要設定判断)</th>
      <th>カテゴリー</th><th>値</th>
    </tr>
    ${rows.map(([ticketNo, info]) => {
      const total = info.inactive + info.unconfigured;
      const current = config[ticketNo] || { category: '', value: '' };
      const needsConfig = info.unconfigured > 0 && !current.category;
      const included = current.included !== false;
      return `
      <tr class="${needsConfig ? 'needs-config' : ''}${included ? '' : ' excluded-row'}" data-ticket-no="${escapeHtml(ticketNo)}" data-ticket-name="${escapeHtml(info.name)}">
        <td><input type="checkbox" class="included-check" ${included ? 'checked' : ''}></td>
        <td>${escapeHtml(info.name || '(名称未設定)')}</td>
        <td>${escapeHtml(ticketNo)}</td>
        <td>${total.toLocaleString()}</td>
        <td>${info.unconfigured.toLocaleString()}</td>
        <td>
          <select class="category-select">
            <option value="">未設定</option>
            ${Object.entries(CATEGORY_LABELS).map(([val, label]) =>
              `<option value="${val}" ${current.category === val ? 'selected' : ''}>${label}</option>`).join('')}
          </select>
        </td>
        <td><input type="text" class="value-input" value="${current.value !== undefined ? escapeHtml(String(current.value)) : ''}"></td>
      </tr>`;
    }).join('')}
  `;

  ticketTableEl.querySelectorAll('tr[data-ticket-no]').forEach(tr => updateValueInput(tr));
  ticketTableEl.querySelectorAll('.category-select').forEach(sel => {
    sel.addEventListener('change', () => updateValueInput(sel.closest('tr')));
  });
  ticketTableEl.querySelectorAll('.included-check').forEach(chk => {
    chk.addEventListener('change', () => chk.closest('tr').classList.toggle('excluded-row', !chk.checked));
  });

  // レポート側の集計は「レポートに含める」がチェックされているチケット種類だけを対象にする
  // (デモ検証用チケットなどを外して、保存直後のサマリーにもすぐ反映させるため)。
  const reportLedger = currentClient.ticketLedger.filter(t => (config[t.ticketNo] || {}).included !== false);
  renderSummary(Dashboard.Tickets.calcTicketValidity(reportLedger, config, new Date()));
}

document.getElementById('include-all-btn').addEventListener('click', () => setAllIncluded(true));
document.getElementById('exclude-all-btn').addEventListener('click', () => setAllIncluded(false));

function setAllIncluded(included) {
  ticketTableEl.querySelectorAll('.included-check').forEach(chk => {
    chk.checked = included;
    chk.closest('tr').classList.toggle('excluded-row', !included);
  });
}

function updateValueInput(tr) {
  const category = tr.querySelector('.category-select').value;
  const valueInput = tr.querySelector('.value-input');
  if (category === 'days_from_issue') {
    valueInput.type = 'number';
    valueInput.placeholder = '日数';
    valueInput.disabled = false;
  } else if (category === 'fixed_date') {
    valueInput.type = 'date';
    valueInput.disabled = false;
  } else {
    valueInput.value = '';
    valueInput.disabled = true;
  }
}

document.getElementById('save-btn').addEventListener('click', async () => {
  const newConfig = {};
  ticketTableEl.querySelectorAll('tr[data-ticket-no]').forEach(tr => {
    const ticketNo = tr.dataset.ticketNo;
    const ticketName = tr.dataset.ticketName;
    const category = tr.querySelector('.category-select').value;
    const value = tr.querySelector('.value-input').value;
    const included = tr.querySelector('.included-check').checked;
    // includedは既定trueなので、チェックを外した(=false)時だけ記録が必要。
    // カテゴリー未設定のままチェックだけ外されたチケットの記録も、ここで取りこぼさないようにする。
    if (category || !included) {
      newConfig[ticketNo] = { name: ticketName, included };
      if (category) { newConfig[ticketNo].category = category; newConfig[ticketNo].value = value || null; }
    }
  });

  saveStatusEl.textContent = '保存中...';
  try {
    await Dashboard.Sync.saveTicketConfig(currentClient.dirHandle, newConfig);
    currentClient.ticketConfig = newConfig;
    saveStatusEl.textContent = '保存しました（' + new Date().toLocaleTimeString() + '）';
    renderTicketTable();
  } catch (e) {
    saveStatusEl.textContent = 'エラー: ' + e.message;
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
